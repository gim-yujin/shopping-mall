name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# 같은 브랜치에 연속 push 시 이전 워크플로우를 자동 취소하여 러너 낭비를 방지한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: 정적검사 & 테스트 ─────────────────────────────
  ci:
    name: Static Analysis & Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write        # 테스트 결과 요약 어노테이션
      pull-requests: write  # JaCoCo 커버리지 PR 코멘트

    env:
      JDK_JAVA_OPTIONS: --enable-native-access=ALL-UNNAMED
      ORG_GRADLE_JVMARGS: -Xmx2g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: shopping_mall_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 4321
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d shopping_mall_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Validate documented metrics drift
        run: ./scripts/validate-doc-stats.sh

      - name: Validate domain dependency rules
        run: ./scripts/check-domain-dependencies.sh

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL readiness
        run: |
          until pg_isready -h localhost -p 5432 -U postgres -d shopping_mall_db; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done

      - name: Reset public schema before check
        env:
          PGPASSWORD: 4321
        run: |
          psql -h localhost -p 5432 -U postgres -d shopping_mall_db -v ON_ERROR_STOP=1 \
            -c "DROP SCHEMA IF EXISTS public CASCADE;" \
            -c "CREATE SCHEMA public;"

      - name: Run quality checks (blocking)
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/shopping_mall_db?stringtype=unspecified
          TEST_DB_USERNAME: postgres
          TEST_DB_PASSWORD: 4321
        run: ./gradlew check

      - name: Run SpotBugs (non-blocking, Java 21 compatibility fallback)
        continue-on-error: true
        run: ./gradlew spotbugsMain spotbugsTest -PenableSpotbugs=true

      - name: Reset public schema before test
        env:
          PGPASSWORD: 4321
        run: |
          psql -h localhost -p 5432 -U postgres -d shopping_mall_db -v ON_ERROR_STOP=1 \
            -c "DROP SCHEMA IF EXISTS public CASCADE;" \
            -c "CREATE SCHEMA public;"

      - name: Run tests
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/shopping_mall_db?stringtype=unspecified
          TEST_DB_USERNAME: postgres
          TEST_DB_PASSWORD: 4321
        run: ./gradlew test --stacktrace # 임시로 스택 트레이스 출력

      - name: Test result summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Results
          path: build/test-results/test/*.xml
          reporter: java-junit

      - name: JaCoCo coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 60
          title: "## JaCoCo Coverage Report"
          update-comment: true

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          if-no-files-found: warn
          path: |
            build/reports/checkstyle/**
            build/reports/pmd/**
            build/reports/spotbugs/**
            build/test-results/test/**

  # ── Job 2: Docker 이미지 빌드 & GHCR 푸시 ────────────────
  # main 브랜치 push 시에만 실행되며, ci job 통과 후 시작된다.
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
