plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs' version '5.2.5'
    id 'jacoco'
}

group = 'com.shop'
version = '1.0.0'

springBoot {
    mainClass = 'com.shop.ShopApplication'
}

def targetJavaVersion = 21

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    // 컴파일/테스트/패키징 산출물의 class file 타깃을 toolchain과 단일화한다.
    options.release = targetJavaVersion
    // Java 21 Preview: Structured Concurrency (JEP 453) 활성화
    options.compilerArgs += ['--enable-preview']
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Caffeine Cache
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // Resilience4j — Circuit Breaker & Timeout 장애 격리
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // springdoc-openapi — Swagger UI / OpenAPI 3 문서 자동 생성
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'

    // Thymeleaf Extras
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.3.0'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // Dev Tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.awaitility:awaitility:4.2.2'
    testImplementation 'org.springframework.security:spring-security-test'
    // Java 21 런타임에서 Mockito inline instrumentation 호환성 보강
    testRuntimeOnly 'net.bytebuddy:byte-buddy:1.17.5'
    testRuntimeOnly 'net.bytebuddy:byte-buddy-agent:1.17.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ── Redis v2 (실험 경로) ──
    // 본 프로젝트의 v1 경로는 PostgreSQL 단독을 유지한다.
    // 아래 의존성은 spring.profiles.active=redis 일 때만 실제로 빈을 등록·로딩한다.
    // (@ConditionalOnProperty / @Profile("redis") 로 보호) — v1 모드 byte-equivalence 보존.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // Lettuce 커넥션 풀 활성화에 필요 (application-redis.yml 의 lettuce.pool.enabled=true 가 의존)
    implementation 'org.apache.commons:commons-pool2:2.12.0'
    testImplementation 'org.testcontainers:testcontainers:1.21.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
}

checkstyle {
    toolVersion = '10.17.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
    ignoreFailures = false
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

pmd {
    toolVersion = '7.17.0'
    ruleSets = []
    ruleSetFiles = files('config/pmd/ruleset.xml')
    consoleOutput = true
}

tasks.withType(Pmd).configureEach {
    ignoreFailures = false
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('pmdTest', Pmd).configure {
    // 테스트 소스는 type resolution 이슈를 유발한 규칙을 분리한 테스트 전용 ruleset을 사용한다.
    ruleSetFiles = files('config/pmd/ruleset-test.xml')
    // 테스트 소스는 별도 ruleset/빈 classpath로 type resolution 잡음을 줄인다.
    classpath = files()
}

tasks.named('pmdMain', Pmd).configure {
    // 임시 우회: PMD의 classpath 기반 type resolution 의존을 낮춰 최신 class 파싱 실패를 회피한다.
    // PMD 버전 상향 후에는 정상 classpath 분석을 다시 활성화할 계획이다.
    classpath = files()
}

spotbugs {
    // Java 21(class file major 65)에서도 안정적으로 동작하도록 최신 호환 후보 유지
    toolVersion = '4.9.8'
    effort = com.github.spotbugs.snom.Effort.MAX
    reportLevel = com.github.spotbugs.snom.Confidence.LOW
    ignoreFailures = true
    if (file('config/spotbugs/excludeFilter.xml').exists()) {
        excludeFilter = file('config/spotbugs/excludeFilter.xml')
    }
}

def enableSpotbugs = providers.gradleProperty('enableSpotbugs')
    .map { it.toBoolean() }
    .orElse(false)

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    // SpotBugs 실행 JDK를 컴파일 toolchain과 동일한 버전으로 고정한다.
    def spotbugsLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    if (metaClass.hasProperty(delegate, 'javaLauncher')) {
        javaLauncher = spotbugsLauncher
    }
    if (metaClass.hasProperty(delegate, 'launcher')) {
        launcher = spotbugsLauncher
    }

    onlyIf {
        enableSpotbugs.get()
    }

    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('printSpotbugsLauncher') {
    group = 'verification'
    description = 'Prints the configured JDK launcher for SpotBugs tasks.'

    doLast {
        tasks.withType(com.github.spotbugs.snom.SpotBugsTask).each { task ->
            def launcherProvider = null
            if (task.metaClass.hasProperty(task, 'javaLauncher')) {
                launcherProvider = task.javaLauncher
            }
            if ((launcherProvider == null || !launcherProvider.isPresent()) && task.metaClass.hasProperty(task, 'launcher')) {
                launcherProvider = task.launcher
            }
            if (launcherProvider == null || !launcherProvider.isPresent()) {
                println("${task.path} -> launcher not configured")
                return
            }
            def launcherMetadata = launcherProvider.get().metadata
            println("${task.path} -> Java ${launcherMetadata.languageVersion} @ ${launcherMetadata.installationPath}")
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // Java 21 Preview: 테스트 JVM에서도 Structured Concurrency 활성화
    jvmArgs += ['--enable-preview']
    // Testcontainers 가 docker-java 클라이언트 API 버전을 1.32로 보내 Docker 29+ 서버(min 1.40)와
    // 충돌하므로, 더 최신 버전으로 명시. v2 Redis 벤치(RedisStockDeductionBenchmarkTest)가 의존.
    environment 'DOCKER_API_VERSION', '1.45'
    systemProperty 'api.version', '1.45'
    // ADR-0003 V4 dip 가설 측정용 시스템 프로퍼티를 테스트 JVM 으로 전달.
    // (gradle 의 -D 는 gradle JVM 에만 적용되므로 명시적 forwarding 필요)
    ['bench.thread.levels', 'spring.data.redis.lettuce.pool.max-active'].each { p ->
        if (System.getProperty(p) != null) {
            systemProperty p, System.getProperty(p)
        }
    }
    // JaCoCo 에이전트를 테스트 실행 시 자동 연결하여 커버리지 데이터를 수집한다.
    finalizedBy tasks.named('jacocoTestReport')
}

// 로컬 실행 편의: SPRING_PROFILES_ACTIVE 가 외부에 설정되어 있지 않으면 'local' 프로파일을 기본 적용한다.
// application-local.yml(gitignored) 에서 DB 자격증명을 읽어 매번 환경변수를 주입할 필요가 없다.
// 운영/CI 환경에서는 SPRING_PROFILES_ACTIVE 또는 --args='--spring.profiles.active=...' 로 오버라이드 가능.
tasks.named('bootRun') {
    if (System.getenv('SPRING_PROFILES_ACTIVE') == null
            && !System.getProperty('spring.profiles.active')) {
        systemProperty 'spring.profiles.active', 'local'
    }
}

// ── JaCoCo 커버리지 설정 ──
// 테스트 실행 후 ./gradlew jacocoTestReport 로 HTML 리포트 생성,
// ./gradlew jacocoTestCoverageVerification 으로 최소 커버리지 검증.
// 리포트 경로: build/reports/jacoco/test/html/index.html
jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn(tasks.named('test'))

    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }

    def excludes = [
            '**/config/**',
            '**/dto/**',
            '**/ShopApplication.class',
            '**/scheduler/**'
    ]

    classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: excludes)
            })
    )
}

// 커버리지 최소 기준 (선택적 — CI에서 ./gradlew jacocoTestCoverageVerification 실행)
// 전체 Instruction 88%, 50% 미만 패키지 0개 달성 후 60%로 상향 (2025-03).
// 현재 최하위 패키지가 61%(wishlist.controller)이므로 60% 기준은 안전 마진 확보 상태이다.
// 다음 상향 시점: 전체 90%+ 달성 후 70%로 검토.
tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    violationRules {
        rule {
            // 프로젝트 전체 기준 라인 커버리지 하한
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.60  // 60% — 2차 기준 (30% → 60%, 2025-03 상향)
            }
        }
    }
}

tasks.named('check') {
    def testTask = tasks.named('test')
    def remainingDependencies = new LinkedHashSet(dependsOn)
    remainingDependencies.removeIf { dep ->
        dep == 'test' || dep == ':test' || dep == testTask || dep == testTask.get() || dep.toString().contains("TestSuite 'test'")
    }
    remainingDependencies.removeIf { dep ->
        dep == 'spotbugsMain' || dep == ':spotbugsMain' || dep == 'spotbugsTest' || dep == ':spotbugsTest'
    }
    setDependsOn(remainingDependencies)
    dependsOn('checkstyleMain', 'checkstyleTest', 'pmdMain', 'pmdTest')

    if (enableSpotbugs.get()) {
        dependsOn('spotbugsMain', 'spotbugsTest')
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs += ["-XX:ReservedCodeCacheSize=512m", "--enable-preview"]
}
