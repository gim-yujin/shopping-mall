# Redis v2 프로파일 — `--spring.profiles.active=redis` 일 때만 머지된다.
#
# 본 파일은 기존 application.yml 을 수정하지 않는다. v1 모드에서는 로딩되지 않으므로
# Spring Boot 의 RedisAutoConfiguration 이 활성화돼도 LettuceConnectionFactory 는
# lazy connection 이라 connect 시도조차 하지 않는다.

spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 1s
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-idle: 16
          min-idle: 4

# v2 swap 활성화 플래그
shop:
  backend: redis           # 일반 주문(OrderStockProcessor) → Redis 경로

flash-sale:
  # 부모 FlashSaleCommandService 의 검증을 통과시키기 위해 lock-strategy 는 기본값(cas) 유지.
  # 별도 backend 속성으로 Redis swap 활성화 — @Primary 로 부모 빈을 대체.
  backend: redis

stock:
  redis:
    enabled: true          # 벤치용 V4-Redis 전략 빈 등록

# [Phase 21] 검색 로그 Redis Streams 브로커.
# Redis 프로파일에서 기본 활성화. 비활성화 시(false) 기존 인메모리+WAL 경로(Phase 19/20) 사용.
app:
  search-log:
    broker:
      enabled: ${APP_SEARCH_LOG_BROKER_ENABLED:true}
      stream: search-log-stream
      consumer-group: search-log-cg
      # consumer-name 미지정 시 properties 의 컴팩트 기본값(host 무관 PID 기반) 사용.
      poll-batch-size: 500
      poll-block: 2s
      db-batch-size: 500
      claim-idle: 60s
      reclaim-interval: 30s
      max-delivery-attempts: 5
      dlq-stream: search-log-dlq
