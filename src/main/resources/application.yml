spring:
  application:
    name: shopping-mall

  datasource:
    # [Phase 2 성능] socketTimeout=30: DB 쿼리 실행 시 소켓 읽기 타임아웃(초).
    # 문제: 기존 설정에 소켓 타임아웃이 없어, 느린 쿼리나 DB 장애 시
    # JDBC 커넥션이 응답을 무한 대기하여 Tomcat 스레드가 고갈될 수 있었다.
    # 해결: 30초 소켓 타임아웃을 설정하여 응답 없는 커넥션을 빠르게 해제한다.
    url: jdbc:postgresql://localhost:5432/shopping_mall_db?stringtype=unspecified&socketTimeout=30
    username: postgres
    password: 4321
    hikari:
      maximum-pool-size: 17 # (8cores × 2) + 1 = 17 (HikariCP 권장 공식)
      # [Phase 2 성능] fixed-size pool → dynamic pool 전환.
      # 문제: minimum-idle=17(=maximum-pool-size)로 고정 크기 풀을 사용하면
      # 유휴 시간에도 17개 커넥션이 항상 점유되어 DB 리소스를 낭비한다.
      # PostgreSQL의 max_connections 기본값(100)에서 다수 애플리케이션이 접속하면
      # 커넥션 부족이 발생할 수 있다.
      # 해결: minimum-idle=7로 낮춰 유휴 시 10개 커넥션을 DB에 반환하고,
      # 부하 증가 시 maximum-pool-size(17)까지 동적으로 확장한다.
      minimum-idle: 7
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 5000 # 30000 → 5000 (빠른 실패)
      # [Phase 11] 커넥션 누수 탐지: 30초 이상 반환되지 않은 커넥션에 대해
      # 경고 로그와 스택 트레이스를 출력한다. 장기 트랜잭션이나 닫히지 않은
      # 커넥션으로 인한 풀 고갈을 조기에 감지하는 안전망 역할.
      leak-detection-threshold: 30000
      # [Phase 11] 비관적 잠금 타임아웃: 모든 커넥션에 PostgreSQL lock_timeout을 설정한다.
      # SELECT ... FOR UPDATE나 pg_advisory_xact_lock이 5초 내에 잠금을 획득하지 못하면
      # 즉시 실패하여 커넥션 풀 고갈을 방지한다.
      # PostgreSQL의 기본값은 0(무한 대기)이므로, 타임아웃 없이는 장기 잠금 대기가
      # 커넥션을 점유하여 다른 요청이 커넥션을 얻지 못하는 연쇄 장애를 유발할 수 있다.
      connection-init-sql: "SET lock_timeout = '5s'"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false  # 커넥션 점유 시간 단축 (쿼리 실행 구간만 점유)
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_batch_fetch_size: 100
        jdbc:
          # [Phase 2 성능] batch_size를 batch_fetch_size와 동일하게 정렬(50→100).
          # 문제: batch_fetch_size=100인데 batch_size=50이면, IN 절로 100건을
          # 일괄 조회한 엔티티를 flush 시 50건씩 2회에 나눠 INSERT/UPDATE한다.
          # 이로 인해 불필요한 flush 왕복이 발생한다.
          # 해결: batch_size=100으로 통일하여 조회-저장 배치 크기를 일치시킨다.
          batch_size: 100
        order_inserts: true
        order_updates: true

  sql:
    init:
      mode: never

  thymeleaf:
    cache: true  # 템플릿 캐시 활성화 (부하 테스트 시 SSR 오버헤드 감소)
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080
  shutdown: graceful  # 배포 시 진행 중인 요청 완료 후 종료
  # [Phase 2 성능] Tomcat 커넥션/요청 타임아웃 설정.
  # 문제: 기존에 Tomcat 레벨 타임아웃이 없어, 클라이언트가 연결만 열고
  # 요청을 보내지 않거나 대용량 요청을 천천히 전송하면 Tomcat 스레드가
  # 무한 대기하여 스레드 풀이 고갈될 수 있었다.
  # 해결: connection-timeout=20s로 요청 헤더 수신 대기 시간을 제한하고,
  # keep-alive-timeout=60s로 유휴 keep-alive 커넥션 회수 시간을 설정한다.
  tomcat:
    connection-timeout: 20000
    keep-alive-timeout: 60000
  servlet:
    session:
      timeout: 30m
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json

spring.lifecycle:
  timeout-per-shutdown-phase: 30s  # graceful shutdown 최대 대기 시간

# ── Actuator 설정 ────────────────────────────────────
# health: 로드밸런서 헬스체크, DB/디스크 상태 모니터링
# info: 빌드 정보, 환경 확인
# metrics: 응답 시간, JVM, HikariCP 풀 모니터링
# caches: Caffeine 캐시 적중률/크기 확인
# prometheus: Prometheus 스크래핑용 메트릭 엔드포인트
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches,prometheus
  endpoint:
    health:
      show-details: when-authorized  # 인증된 사용자만 상세 정보 표시
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: INFO
    com.shop: INFO # DEBUG → INFO (부하 테스트 시 로그 I/O 감소)
    org.hibernate.SQL: WARN # DEBUG → WARN (SQL 로그 비활성화)
    org.hibernate.type.descriptor.sql.BasicBinder: WARN # TRACE → WARN

security:
  login-attempt:
    trusted-proxy-cidrs:
      - 127.0.0.1/32
      - 10.0.0.0/8
      - 192.168.0.0/16
    trusted-hop-count: 1

app:
  async:
    # graceful shutdown 대기 시간(초): 배포/재시작 시 비동기 로그 flush를 위한 설정
    await-termination-seconds: 30
    metrics:
      logging-enabled: true
      log-interval-ms: 30000
  # 멱등성 키 레코드 관리 설정
  idempotency:
    retention-hours: 24      # COMPLETED/FAILED 레코드 보존 기간 (시간)
    cleanup-batch-size: 5000 # 정리 스케줄러 1회당 삭제 배치 크기
  # Transactional Outbox 설정
  outbox:
    max-retries: 5           # 이벤트 처리 최대 재시도 횟수 (초과 시 FAILED)
    batch-size: 100          # 폴러 1회당 처리할 최대 이벤트 수
    retention-days: 7        # PROCESSED 이벤트 보존 기간 (일)
    cleanup-batch-size: 5000 # 정리 스케줄러 1회당 삭제 배치 크기

