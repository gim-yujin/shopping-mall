spring:
  application:
    name: shopping-mall

  datasource:
    # 운영/로컬 실행은 환경변수로만 주입한다.
    # 실행 필수값:
    # - SPRING_DATASOURCE_URL
    # - SPRING_DATASOURCE_USERNAME
    # - SPRING_DATASOURCE_PASSWORD
    # [Phase 2 성능] socketTimeout=30: DB 쿼리 실행 시 소켓 읽기 타임아웃(초).
    # 문제: 기존 설정에 소켓 타임아웃이 없어, 느린 쿼리나 DB 장애 시
    # JDBC 커넥션이 응답을 무한 대기하여 Tomcat 스레드가 고갈될 수 있었다.
    # 해결: 30초 소켓 타임아웃을 설정하여 응답 없는 커넥션을 빠르게 해제한다.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 17 # (8cores × 2) + 1 = 17 (HikariCP 권장 공식)
      # [Phase 2 성능] fixed-size pool → dynamic pool 전환.
      # 문제: minimum-idle=17(=maximum-pool-size)로 고정 크기 풀을 사용하면
      # 유휴 시간에도 17개 커넥션이 항상 점유되어 DB 리소스를 낭비한다.
      # PostgreSQL의 max_connections 기본값(100)에서 다수 애플리케이션이 접속하면
      # 커넥션 부족이 발생할 수 있다.
      # 해결: minimum-idle=7로 낮춰 유휴 시 10개 커넥션을 DB에 반환하고,
      # 부하 증가 시 maximum-pool-size(17)까지 동적으로 확장한다.
      minimum-idle: 7
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 5000 # 30000 → 5000 (빠른 실패)
      # [Phase 11] 커넥션 누수 탐지: 30초 이상 반환되지 않은 커넥션에 대해
      # 경고 로그와 스택 트레이스를 출력한다. 장기 트랜잭션이나 닫히지 않은
      # 커넥션으로 인한 풀 고갈을 조기에 감지하는 안전망 역할.
      leak-detection-threshold: 30000
      # [Phase 11] 비관적 잠금 타임아웃: 모든 커넥션에 PostgreSQL lock_timeout을 설정한다.
      # SELECT ... FOR UPDATE나 pg_advisory_xact_lock이 5초 내에 잠금을 획득하지 못하면
      # 즉시 실패하여 커넥션 풀 고갈을 방지한다.
      # PostgreSQL의 기본값은 0(무한 대기)이므로, 타임아웃 없이는 장기 잠금 대기가
      # 커넥션을 점유하여 다른 요청이 커넥션을 얻지 못하는 연쇄 장애를 유발할 수 있다.
      connection-init-sql: "SET lock_timeout = '5s'"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false  # 커넥션 점유 시간 단축 (쿼리 실행 구간만 점유)
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_batch_fetch_size: 100
        jdbc:
          # [Phase 2 성능] batch_size를 batch_fetch_size와 동일하게 정렬(50→100).
          # 문제: batch_fetch_size=100인데 batch_size=50이면, IN 절로 100건을
          # 일괄 조회한 엔티티를 flush 시 50건씩 2회에 나눠 INSERT/UPDATE한다.
          # 이로 인해 불필요한 flush 왕복이 발생한다.
          # 해결: batch_size=100으로 통일하여 조회-저장 배치 크기를 일치시킨다.
          batch_size: 100
        order_inserts: true
        order_updates: true

  sql:
    init:
      mode: never

  thymeleaf:
    cache: true  # 템플릿 캐시 활성화 (부하 테스트 시 SSR 오버헤드 감소)
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080
  shutdown: graceful  # 배포 시 진행 중인 요청 완료 후 종료
  # [Phase 2 성능] Tomcat 커넥션/요청 타임아웃 설정.
  # 문제: 기존에 Tomcat 레벨 타임아웃이 없어, 클라이언트가 연결만 열고
  # 요청을 보내지 않거나 대용량 요청을 천천히 전송하면 Tomcat 스레드가
  # 무한 대기하여 스레드 풀이 고갈될 수 있었다.
  # 해결: connection-timeout=20s로 요청 헤더 수신 대기 시간을 제한하고,
  # keep-alive-timeout=60s로 유휴 keep-alive 커넥션 회수 시간을 설정한다.
  tomcat:
    connection-timeout: 20000
    keep-alive-timeout: 60000
  servlet:
    session:
      timeout: 30m
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json

spring.lifecycle:
  timeout-per-shutdown-phase: 30s  # graceful shutdown 최대 대기 시간

# ── Actuator 설정 ────────────────────────────────────
# health: 로드밸런서 헬스체크, DB/디스크 상태 모니터링
# info: 빌드 정보, 환경 확인
# metrics: 응답 시간, JVM, HikariCP 풀 모니터링
# caches: Caffeine 캐시 적중률/크기 확인
# prometheus: Prometheus 스크래핑용 메트릭 엔드포인트
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when-authorized  # 인증된 사용자만 상세 정보 표시
  health:
    circuitbreakers:
      enabled: true  # /actuator/health에 서킷 브레이커 상태(CLOSED/OPEN/HALF_OPEN) 포함
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# ── Resilience4j 장애 격리 설정 ────────────────────────────────────
# 서비스 간(cross-domain) 호출에 Circuit Breaker + Timeout을 적용하여
# 하나의 도메인 서비스 장애가 다른 도메인으로 전파(cascading failure)되는 것을 방지한다.
#
# 동작 원리:
#   1) Circuit Breaker — 최근 N건의 호출 결과를 추적하여 실패율이 임계값을 초과하면
#      서킷을 OPEN하여 즉시 실패(fail-fast)를 반환한다.
#      OPEN → (waitDuration) → HALF_OPEN → 시험 호출 성공 시 → CLOSED 순환.
#   2) TimeLimiter — 비동기(CompletableFuture) 호출에 타임아웃을 적용한다.
#      지정 시간 내 응답이 없으면 TimeoutException을 발생시켜 스레드 점유를 해제한다.
#   3) slowCallDurationThreshold — 동기 호출에서 Timeout 역할을 겸한다.
#      지정 시간을 초과한 호출을 "느린 호출"로 기록하고, 느린 호출 비율이
#      임계값을 넘으면 서킷을 OPEN하여 더 이상의 스레드 누적을 방지한다.
resilience4j:
  circuitbreaker:
    configs:
      # ── 기본(default) 서킷 브레이커 설정 ──
      # 모든 인스턴스의 기본값. 개별 인스턴스에서 필요한 항목만 오버라이드한다.
      default:
        # 슬라이딩 윈도우 타입: COUNT_BASED = 최근 N건 기준.
        # TIME_BASED(최근 N초)는 호출량이 적은 서비스에서 윈도우가 비어
        # 서킷이 제대로 동작하지 않을 수 있으므로 COUNT_BASED를 기본으로 한다.
        slidingWindowType: COUNT_BASED
        # 슬라이딩 윈도우 크기: 최근 10건의 호출 결과로 실패율을 계산한다.
        slidingWindowSize: 10
        # 최소 호출 횟수: 이 횟수 미만에서는 실패율을 계산하지 않는다.
        # 서비스 시작 직후나 저트래픽 시간대에 오탐(false positive)을 방지한다.
        minimumNumberOfCalls: 5
        # 실패율 임계값(%): 이 비율 이상 실패하면 서킷이 OPEN된다.
        # 50% = 최근 10건 중 5건 이상 인프라 장애 시 서킷 개방.
        failureRateThreshold: 50
        # OPEN → HALF_OPEN 대기 시간: 서킷 개방 후 이 시간이 지나면
        # HALF_OPEN으로 전환하여 시험 호출을 허용한다.
        waitDurationInOpenState: 30s
        # HALF_OPEN에서 허용할 시험 호출 수:
        # 이 호출들의 결과로 서킷을 다시 닫을지(CLOSED) 열어둘지(OPEN) 결정한다.
        permittedNumberOfCallsInHalfOpenState: 3
        # [Timeout 역할] 느린 호출 기준 시간:
        # 이 시간을 초과하면 "느린 호출"로 기록한다.
        # DB 잠금 대기, 쿼리 지연 등 성능 저하를 감지하는 Timeout 메커니즘이다.
        slowCallDurationThreshold: 3s
        # [Timeout 역할] 느린 호출 비율 임계값(%):
        # 느린 호출이 이 비율을 초과하면 서킷을 OPEN한다.
        # → 대기 중인 스레드가 누적되어 Tomcat 스레드 풀이 고갈되는 것을 방지.
        slowCallRateThreshold: 80
        # OPEN → HALF_OPEN 자동 전환: true이면 waitDuration 후 자동 전환.
        # false이면 다음 호출 시도가 있어야 전환된다.
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # 실패로 기록할 예외: 인프라/일시적 장애만 카운트한다.
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.dao.DataAccessException
        # 무시할 예외: 비즈니스 로직에 의한 정상적인 거절은 카운트하지 않는다.
        # (예: "재고 부족", "쿠폰 만료" 등은 시스템 장애가 아니다)
        ignoreExceptions:
          - com.shop.global.exception.BusinessException
          - com.shop.global.exception.ResourceNotFoundException

    instances:
      # ── 장바구니 서비스 ──
      # 체크아웃 시 장바구니 항목 조회에 사용.
      cartService:
        baseConfig: default

      # ── 사용자 서비스 ──
      # 사용자 정보/등급 조회에 사용. 단순 PK 조회이므로 느린 호출 기준을 짧게 설정.
      userService:
        baseConfig: default
        slowCallDurationThreshold: 2s

      # ── 쿠폰 서비스 ──
      # 사용 가능한 쿠폰 목록 조회. 비필수(non-critical) 서비스이므로
      # 장애 시 빈 목록을 폴백으로 반환하여 체크아웃을 계속 진행할 수 있다.
      # 따라서 더 관대한 임계값을 적용한다.
      couponService:
        baseConfig: default
        failureRateThreshold: 60

      # ── 주문 생성 ──
      # 전체 주문 생성 플로우를 감싸는 서킷.
      # 핵심 비즈니스 기능이므로 보수적인 설정을 적용한다:
      # - 넓은 윈도우(20건)와 높은 최소 호출(10건)으로 충분한 표본 확보 후 판단
      # - 높은 실패율 임계값(70%)으로 일시적 장애에 과민 반응 방지
      # - 짧은 대기 시간(15s)으로 빠른 복구 시도
      # - 비관적 잠금 대기를 감안하여 느린 호출 기준을 여유 있게 설정(5s)
      orderCreation:
        baseConfig: default
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 70
        waitDurationInOpenState: 15s
        slowCallDurationThreshold: 5s
        slowCallRateThreshold: 90

  timelimiter:
    configs:
      # ── 기본 TimeLimiter 설정 ──
      # ResilientCallExecutor에서 CompletableFuture 기반 비동기 래핑 시 적용된다.
      # 읽기 전용(read-only) 크로스 도메인 호출에 사용한다.
      default:
        # 타임아웃 시간: 이 시간 내 응답이 없으면 TimeoutException 발생.
        timeoutDuration: 3s
        # 타임아웃 시 워커 스레드에 interrupt 신호를 보낼지 여부.
        # JDBC 호출은 일반적으로 interrupt에 반응하지 않으므로,
        # DB 레벨 타임아웃(socketTimeout=30s)이 최종 안전망 역할을 한다.
        cancelRunningFuture: true
    instances:
      cartService:
        baseConfig: default
        timeoutDuration: 3s
      userService:
        baseConfig: default
        timeoutDuration: 2s
      couponService:
        baseConfig: default
        timeoutDuration: 3s

  retry:
    configs:
      # ── 기본 Retry 설정 ──
      # 일시적(transient) 인프라 장애에 대한 자동 재시도.
      # 서킷 브레이커와 조합하여 사용한다:
      #   Retry(외부) → CircuitBreaker → TimeLimiter → 실제 호출
      # → 실패 시 Retry가 재시도하고, 각 시도(성공/실패)가 CircuitBreaker에 기록된다.
      # → 재시도를 포함한 최종 실패율이 임계값을 초과하면 서킷이 OPEN된다.
      default:
        # 최대 시도 횟수 (첫 시도 포함): 3 = 첫 시도 + 재시도 2회.
        maxAttempts: 3
        # 재시도 간 대기 시간 (지수 백오프 적용 전 기본값).
        waitDuration: 200ms
        # 지수 백오프 활성화: 재시도마다 대기 시간이 기하급수적으로 증가한다.
        # 200ms → 400ms → 800ms (multiplier=2)
        # 동시 재시도들이 같은 시점에 다시 충돌하는 Thundering Herd를 방지한다.
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        # 재시도할 예외: 일시적 인프라 장애만 재시도한다.
        # DB 커넥션 풀 일시 고갈, 네트워크 끊김, 쿼리 타임아웃 등이 해당된다.
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.dao.DataAccessException
        # 재시도하지 않을 예외: 비즈니스 로직에 의한 정상 거절과
        # 서킷 OPEN 상태는 재시도해도 결과가 같으므로 즉시 실패한다.
        # BusinessException: "재고 부족", "쿠폰 만료" 등 비즈니스 규칙 위반
        # ResourceNotFoundException: "상품을 찾을 수 없습니다" 등
        # CallNotPermittedException: 서킷 OPEN 상태에서의 호출 차단
        ignoreExceptions:
          - com.shop.global.exception.BusinessException
          - com.shop.global.exception.ResourceNotFoundException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

    instances:
      # 장바구니/사용자/쿠폰 서비스: 읽기 전용 호출이므로 부작용 없이 재시도 가능.
      cartService:
        baseConfig: default
      userService:
        baseConfig: default
      couponService:
        baseConfig: default

      # 주문 생성: 쓰기 작업이므로 재시도를 최소화한다.
      # @Transactional 롤백 후 재시도하므로 데이터 정합성은 보장되지만,
      # 비관적 잠금 경합이 심한 상황에서 과도한 재시도는 오히려 부하를 가중시킨다.
      # maxAttempts=2: 첫 시도 + 재시도 1회로 제한.
      # waitDuration=500ms: DB 복구 시간을 확보하기 위해 기본값보다 길게 설정.
      orderCreation:
        baseConfig: default
        maxAttempts: 2
        waitDuration: 500ms

logging:
  level:
    root: INFO
    com.shop: INFO # DEBUG → INFO (부하 테스트 시 로그 I/O 감소)
    org.hibernate.SQL: WARN # DEBUG → WARN (SQL 로그 비활성화)
    org.hibernate.type.descriptor.sql.BasicBinder: WARN # TRACE → WARN

security:
  login-attempt:
    trusted-proxy-cidrs:
      - 127.0.0.1/32
      - 10.0.0.0/8
      - 192.168.0.0/16
    trusted-hop-count: 1

app:
  async:
    # graceful shutdown 대기 시간(초): 배포/재시작 시 비동기 로그 flush를 위한 설정
    await-termination-seconds: 30
    metrics:
      logging-enabled: true
      log-interval-ms: 30000
  # 멱등성 키 레코드 관리 설정
  idempotency:
    retention-hours: 24      # COMPLETED/FAILED 레코드 보존 기간 (시간)
    cleanup-batch-size: 5000 # 정리 스케줄러 1회당 삭제 배치 크기
    # [Phase 14] PROCESSING 타임아웃: 서버 크래시 등으로 PROCESSING 상태에서 고착된 레코드를
    # 이 시간이 경과하면 FAILED로 자동 전환하여 클라이언트 재시도를 허용한다.
    stale-timeout-minutes: 5
  # Transactional Outbox 설정
  outbox:
    max-retries: 5           # 이벤트 처리 최대 재시도 횟수 (초과 시 DEAD_LETTER)
    batch-size: 100          # 폴러 1회당 처리할 최대 이벤트 수
    retention-days: 7        # PROCESSED 이벤트 보존 기간 (일)
    cleanup-batch-size: 5000 # 정리 스케줄러 1회당 삭제 배치 크기
    # [Phase 15] 지수 백오프 기본 지연: 10s → 20s → 40s → 80s → 160s (cap=300s)
    retry-base-delay-sec: 10
    # Retry Budget: 한 폴링 주기당 처리할 최대 재시도 이벤트 수.
    # 외부 서비스 복구 후 대량의 재시도가 한꺼번에 eligible해져도
    # 신규 이벤트 처리가 밀리지 않도록 제한한다.
    retry-budget-per-poll: 20
    # Retry Jitter: 지수 백오프에 적용할 랜덤 변동 비율 (0.0~1.0).
    # 동시 실패한 이벤트들의 재시도 시각을 분산시켜 Thundering Herd를 방지한다.
    # 0.25 = ±25% 변동 (예: 40초 백오프 → 30~50초 사이로 분산)
    jitter-factor: 0.25
    # [Phase 15] Dead Letter 보존 기간: 원인 분석을 위해 PROCESSED보다 긴 30일 보존
    dead-letter-retention-days: 30
  # [Phase 19] 검색 로그 배치 쓰기 설정
  # 기존: @Async 개별 INSERT → 초당 1000건 = 1000 DB 라운드트립
  # 개선: 인메모리 버퍼 + 주기적 배치 INSERT → 초당 1000건 = 2 DB 라운드트립 (5초 간격)
  search-log:
    retention-days: 30             # 보존 기간 (SearchLogCleanupScheduler 사용)
    cleanup-batch-size: 10000      # 정리 스케줄러 1회당 삭제 배치 크기
    batch:
      flush-interval-ms: 5000      # 배치 플러시 주기 (밀리초) — 5초마다 버퍼의 로그를 DB에 저장
      batch-size: 500              # 한 번의 플러시에서 처리할 최대 건수
      max-buffer-size: 10000       # 버퍼 최대 크기 — 초과 시 새 로그 폐기 (통계 목적이므로 유실 허용)
