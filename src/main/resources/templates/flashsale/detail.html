<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title th:text="${flashSale.title}">플래시 세일 상세</title></head>
<body>
<div layout:fragment="content">
    <div class="max-w-5xl mx-auto px-4 py-8">

        <nav class="text-sm text-gray-500 mb-4">
            <a th:href="@{/flash-sales}" class="hover:text-indigo-600">플래시 세일</a>
            <span class="mx-1">/</span>
            <span th:text="${flashSale.title}" class="text-gray-900"></span>
        </nav>

        <header class="mb-6">
            <div class="flex items-center gap-3 mb-2">
                <h1 class="text-2xl font-bold text-gray-900" th:text="${flashSale.title}"></h1>
                <span th:if="${flashSale.status.name() == 'ACTIVE'}"
                      class="inline-block bg-red-100 text-red-700 px-2 py-0.5 rounded text-sm">진행중</span>
                <span th:if="${flashSale.status.name() == 'SCHEDULED'}"
                      class="inline-block bg-gray-100 text-gray-600 px-2 py-0.5 rounded text-sm">예정</span>
                <span th:if="${flashSale.status.name() == 'ENDED'}"
                      class="inline-block bg-gray-200 text-gray-500 px-2 py-0.5 rounded text-sm">종료</span>
                <span th:if="${flashSale.status.name() == 'CANCELLED'}"
                      class="inline-block bg-gray-200 text-gray-500 px-2 py-0.5 rounded text-sm">취소</span>
            </div>
            <div class="text-sm text-gray-500">
                <span th:text="${#temporals.format(flashSale.startTime, 'yyyy-MM-dd HH:mm')}"></span>
                ~
                <span th:text="${#temporals.format(flashSale.endTime, 'yyyy-MM-dd HH:mm')}"></span>
            </div>
        </header>

        <div class="space-y-4">
            <div th:each="item : ${flashSale.items}"
                 class="bg-white border border-gray-200 rounded-lg p-6 flex gap-6">
                <img th:src="${item.thumbnailUrl}" alt=""
                     class="w-32 h-32 object-cover rounded border border-gray-100 flex-shrink-0"
                     onerror="this.src='/images/product-placeholder.svg'"/>
                <div class="flex-1">
                    <div class="text-lg font-medium text-gray-900 mb-1" th:text="${item.productName}"></div>
                    <div class="text-sm text-gray-500 mb-3" th:text="${item.description}"></div>
                    <div class="flex items-baseline gap-3 mb-2">
                        <span class="text-3xl font-bold text-red-600"
                              th:text="${#numbers.formatInteger(item.salePrice, 0, 'COMMA')} + '원'"></span>
                        <span th:if="${item.originalPrice != null}"
                              class="text-base text-gray-400 line-through"
                              th:text="${#numbers.formatInteger(item.originalPrice, 0, 'COMMA')} + '원'"></span>
                    </div>
                    <div class="text-xs text-gray-500 mb-3">
                        남은 수량 <span th:text="${item.remainingApprox}"></span> /
                        할당 <span th:text="${item.allocatedQuantity}"></span> /
                        1인 최대 <span th:text="${item.perUserLimit}"></span>개
                    </div>
                    <div>
                        <button th:if="${flashSale.status.name() == 'ACTIVE' and item.remainingApprox > 0}"
                                type="button"
                                class="flash-sale-purchase-btn bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded"
                                th:data-sale-id="${flashSale.flashSaleId}"
                                th:data-item-id="${item.flashSaleItemId}">
                            구매하기
                        </button>
                        <span th:if="${flashSale.status.name() == 'SCHEDULED'}"
                              class="inline-block bg-gray-100 text-gray-600 px-4 py-2 rounded">시작 전</span>
                        <span th:if="${flashSale.status.name() == 'ENDED' or flashSale.status.name() == 'CANCELLED'}"
                              class="inline-block bg-gray-100 text-gray-500 px-4 py-2 rounded">종료된 세일</span>
                        <span th:if="${flashSale.status.name() == 'ACTIVE' and item.remainingApprox <= 0}"
                              class="inline-block bg-gray-200 text-gray-500 px-4 py-2 rounded">매진</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.flash-sale-purchase-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var saleId = btn.getAttribute('data-sale-id');
                    var itemId = btn.getAttribute('data-item-id');
                    btn.disabled = true;
                    btn.textContent = '처리 중...';
                    fetch('/api/v1/flash-sales/' + saleId + '/items/' + itemId + '/purchase', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Idempotency-Key': (crypto.randomUUID ? crypto.randomUUID()
                                : Date.now() + '-' + Math.random().toString(36).slice(2))
                        }
                    }).then(function (r) {
                        return r.json().then(function (body) { return { status: r.status, body: body }; });
                    }).then(function (res) {
                        if (res.body && res.body.success && res.body.data && res.body.data.orderId) {
                            window.location.href = '/orders/' + res.body.data.orderId;
                            return;
                        }
                        var msg = (res.body && res.body.error && res.body.error.message) || '구매에 실패했습니다.';
                        alert(msg);
                        btn.disabled = false;
                        btn.textContent = '구매하기';
                    }).catch(function () {
                        alert('네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
                        btn.disabled = false;
                        btn.textContent = '구매하기';
                    });
                });
            });
        });
    </script>
</div>
</body>
</html>
