<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title>플래시 세일</title></head>
<body>
<div layout:fragment="content">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">플래시 세일</h1>
            <p class="text-sm text-gray-500 mt-2">한정 수량·한정 시간 특가. 준비되면 구매 버튼이 활성화됩니다.</p>
        </div>

        <div th:if="${flashSales == null or flashSales.isEmpty()}"
             class="bg-white border border-gray-200 rounded-lg p-12 text-center text-gray-500">
            현재 진행중이거나 예정된 세일이 없습니다.
        </div>

        <div th:each="sale : ${flashSales}" class="mb-10">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h2 class="text-xl font-semibold text-gray-900" th:text="${sale.title}"></h2>
                    <div class="mt-1 flex items-center gap-3 text-sm">
                        <span th:if="${sale.status.name() == 'ACTIVE'}"
                              class="inline-block bg-red-100 text-red-700 px-2 py-0.5 rounded">진행중</span>
                        <span th:if="${sale.status.name() == 'SCHEDULED'}"
                              class="inline-block bg-gray-100 text-gray-600 px-2 py-0.5 rounded">예정</span>
                        <span class="text-gray-500">
                            <span th:text="${#temporals.format(sale.startTime, 'MM-dd HH:mm')}"></span>
                            ~
                            <span th:text="${#temporals.format(sale.endTime, 'MM-dd HH:mm')}"></span>
                        </span>
                    </div>
                </div>
                <a th:href="@{/flash-sales/{id}(id=${sale.flashSaleId})}"
                   class="text-sm text-indigo-600 hover:text-indigo-800">상세 &rarr;</a>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div th:each="item : ${sale.items}"
                     class="bg-white border border-gray-200 rounded-lg p-4 flex flex-col">
                    <div class="flex-1">
                        <div class="text-base font-medium text-gray-900 mb-2" th:text="${item.productName}"></div>
                        <div class="flex items-baseline gap-2 mb-2">
                            <span class="text-2xl font-bold text-red-600"
                                  th:text="${#numbers.formatInteger(item.salePrice, 0, 'COMMA')} + '원'"></span>
                            <span th:if="${item.originalPrice != null}"
                                  class="text-sm text-gray-400 line-through"
                                  th:text="${#numbers.formatInteger(item.originalPrice, 0, 'COMMA')} + '원'"></span>
                        </div>
                        <div class="text-xs text-gray-500">
                            남은 수량 <span th:text="${item.remainingApprox}"></span> /
                            할당 <span th:text="${item.allocatedQuantity}"></span>
                        </div>
                    </div>
                    <div class="mt-3">
                        <span th:if="${item.remainingApprox <= 0}"
                              class="inline-block w-full text-center bg-gray-200 text-gray-500 px-4 py-2 rounded">매진</span>
                        <a th:if="${item.remainingApprox > 0}"
                           th:href="@{/flash-sales/{id}(id=${sale.flashSaleId})}"
                           class="inline-block w-full text-center bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">자세히 보기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
