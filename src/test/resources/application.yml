spring:
  application:
    name: shopping-mall

  datasource:
    # [Phase 2 성능] 테스트 환경도 운영과 동일한 소켓 타임아웃 적용.
    # 테스트에서 느린 쿼리가 무한 대기하여 CI 파이프라인이 중단되는 것을 방지한다.
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/shopping_mall_db?stringtype=unspecified&socketTimeout=30}
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD:4321}
    hikari:
      maximum-pool-size: 17
      # [Phase 19] 테스트 환경의 minimum-idle을 축소.
      # 다수의 @SpringBootTest가 서로 다른 @TestPropertySource로 독립 컨텍스트를 생성하면,
      # 각 컨텍스트마다 별도 HikariPool이 생성된다. 기존 minimum-idle=7 × 8개 컨텍스트 = 56개
      # idle 커넥션이 PostgreSQL max_connections(100)을 소진하여
      # 후속 컨텍스트의 초기화가 CannotGetJdbcConnectionException으로 실패했다.
      # minimum-idle=5로 줄이면 idle 총량이 40으로 감소하여 동시 풀 공존이 가능하고,
      # 동시성 테스트(5스레드)도 즉시 커넥션을 확보하여 진정한 경합을 발생시킬 수 있다.
      minimum-idle: 5
      # [Phase 24] idle-timeout 5분 → 30초로 단축.
      # idle-timeout 이 길면 직전 테스트가 max-pool-size(17)까지 끌어올린 커넥션이 5분간
      # idle 상태로 남아 다른 컨텍스트의 schema 초기화 시 PG max_connections(100)을 압박한다
      # (2026-04 CI 사고: 11개 컨텍스트 × 누적 idle 17 ≈ 100 + α). 30초로 줄이면 활성
      # in-use 커넥션은 영향이 없고(in-use 는 idle-timeout 대상이 아님) 직전 부하 완료 후
      # 30초 내에 minimum-idle(5)로 수축한다.
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 5000
      # [Phase 11] 운영과 동일한 커넥션 누수 탐지 활성화.
      leak-detection-threshold: 30000
      # [Phase 11] 잠금 타임아웃 — 테스트 환경은 동시성 테스트에서 다수 스레드가
      # 직렬 실행되므로 운영(5s)보다 여유 있는 10초로 설정한다.
      connection-init-sql: "SET lock_timeout = '10s'"

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_batch_fetch_size: 100
        jdbc:
          # [Phase 2 성능] 운영과 동일하게 batch_size=100으로 정렬.
          batch_size: 100
        order_inserts: true
        order_updates: true

  sql:
    init:
      mode: always
      schema-locations:
        - classpath:test-reset.sql
        - classpath:schema.sql
      data-locations:
        - classpath:test-seed.sql

  thymeleaf:
    cache: true
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json

# [Phase 16] 캐시 워밍 비활성화 — 테스트 데이터 삽입 전에 캐시가 채워지는 것을 방지
shop:
  cache:
    warm-on-startup: false

# [Phase 19] 검색 로그 배치 누적기 테스트 설정.
# 자동 플러시 간격을 충분히 길게 설정하여, 테스트 중 @Scheduled 플러시가
# DB 스키마 리셋(test-reset.sql)과 경합하지 않도록 한다.
# 통합 테스트에서는 accumulator.flush()를 명시적으로 호출하여 결정적(deterministic) 검증.
app:
  # [Phase 19] 테스트 환경에서 @Scheduled 메서드 전체를 비활성화한다.
  # 다수의 @SpringBootTest 컨텍스트가 동일 DB를 공유하므로, 한 컨텍스트가 스키마를
  # 리셋(test-reset.sql: DROP SCHEMA CASCADE)하는 동안 다른 컨텍스트의 @Scheduled 메서드
  # (OutboxEventPoller, IdempotencyCleanupScheduler 등)가 삭제된 테이블에 접근하면
  # "relation does not exist" 오류가 발생하여 컨텍스트 로딩이 실패한다.
  # 테스트에서 스케줄러 동작 검증이 필요한 경우 해당 메서드를 직접 호출한다.
  scheduling:
    enabled: false
  idempotency:
    require-order-write-key: false
  search-log:
    batch:
      flush-interval-ms: 600000
      batch-size: 500
      max-buffer-size: 10000

# ── Resilience4j 테스트 설정 ────────────────────────────────────
# 테스트 환경에서는 서킷 브레이커가 테스트 결과에 영향을 주지 않도록
# 매우 관대한 설정을 적용한다.
# - 높은 minimumNumberOfCalls(100)로 서킷이 사실상 열리지 않게 한다.
# - 높은 failureRateThreshold(100%)로 모든 실패를 허용한다.
# - 넉넉한 타임아웃(30s)으로 느린 테스트 환경(CI)에서도 타임아웃이 발생하지 않게 한다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 100
        minimumNumberOfCalls: 100
        failureRateThreshold: 100
        slowCallDurationThreshold: 30s
        slowCallRateThreshold: 100
        waitDurationInOpenState: 1s
        permittedNumberOfCallsInHalfOpenState: 100
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.dao.DataAccessException
        ignoreExceptions:
          - com.shop.global.exception.BusinessException
          - com.shop.global.exception.ResourceNotFoundException
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
        cancelRunningFuture: true
  retry:
    configs:
      default:
        maxAttempts: 1
        waitDuration: 1ms
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.dao.DataAccessException
        ignoreExceptions:
          - com.shop.global.exception.BusinessException
          - com.shop.global.exception.ResourceNotFoundException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

logging:
  level:
    root: INFO
    com.shop: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
